# Local services (decision 0006: everything on the laptop until the launch gate).
# Postgres for the app, MinIO as the S3-compatible store, Mailpit as the local mailbox.
# Start: docker compose up -d. Stop and keep data: docker compose down. Wipe: docker compose down -v.
# Image settings below are the images' documented defaults as remembered; the docs sites were
# not reachable from the build session, so the first `docker compose up` on Mihai's laptop is
# the check (docs/setup.md).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smesay
      POSTGRES_PASSWORD: smesay
      POSTGRES_DB: smesay
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smesay -d smesay"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: smesay
      MINIO_ROOT_PASSWORD: smesay-local
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres:
  minio:

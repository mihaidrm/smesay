# Local services (decision 0006: everything on the laptop until the launch gate).
# Postgres for the app, RustFS as the S3-compatible store (decision 0025), Mailpit as the local mailbox.
# Start: docker compose up -d. Stop and keep data: docker compose down. Wipe: docker compose down -v.
# Sources for each image's settings are in docs/setup.md. Docker is not available in the build
# session, so the first `docker compose up` on Mihai's laptop is the run check.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smesay
      POSTGRES_PASSWORD: smesay
      POSTGRES_DB: smesay
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smesay -d smesay"]
      interval: 5s
      timeout: 3s
      retries: 10

  rustfs:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: smesay
      RUSTFS_SECRET_KEY: smesay-local
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs:/data

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres:
  rustfs:

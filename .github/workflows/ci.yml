name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smesay
          POSTGRES_PASSWORD: smesay
          POSTGRES_DB: smesay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smesay -d smesay"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mailpit:
        image: axllent/mailpit
        ports:
          - 1025:1025
          - 8025:8025
      # The S3-compatible store for the logo upload (stories/E2-5), the compose RustFS
      # (decision 0025); the app creates the bucket on first use.
      rustfs:
        image: rustfs/rustfs:1.0.0
        env:
          RUSTFS_ACCESS_KEY: smesay
          RUSTFS_SECRET_KEY: smesay-local
          RUSTFS_ADDRESS: ":9000"
        ports:
          - 9000:9000
    env:
      CI: "true"
      DATABASE_URL: postgres://smesay:smesay@localhost:5432/smesay
      # The CI session secret is for the throwaway CI database only; it is no secret.
      BETTER_AUTH_SECRET: ci-only-secret-for-the-throwaway-database
      BETTER_AUTH_URL: http://localhost:3000
      # Placeholders so the Google button renders in CI (stories/E2-2): the Playwright test
      # answers the request to Google itself, so these values are never sent anywhere; the
      # real values stay in the repository secrets and are not used by CI.
      GOOGLE_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: ci-placeholder-secret
      MAIL_SMTP_URL: smtp://localhost:1025
      EMAIL_FROM: SMEsay <sign-in@localhost>
      # The landing page's question bubble (stories/E12-5) shows only when this is set; the
      # value is the error pages' own default, so nothing else changes. Mail goes to Mailpit.
      NEXT_PUBLIC_SUPPORT_EMAIL: hello@smesay.app
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: uploads
      S3_ACCESS_KEY_ID: smesay
      S3_SECRET_ACCESS_KEY: smesay-local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The store answers on 9000 once up; a request to it before then would fail the upload test.
      - run: for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:9000/ && break; sleep 1; done
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run scan:copy
      - run: npm run check:status
      - run: npm run db:migrate
      - run: npm run db:migrate
      - run: npm test
      - run: npm run build
      - run: npm run check:bundle
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Backup, then restore into a new empty database and compare every table's row count
      # (stories/E11-4, acceptance 5). The Postgres tools run from the postgres:16-alpine image,
      # on the host's network, so they match the service's version.
      - run: npm run backup:check
        env:
          PG_TOOLS: docker
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

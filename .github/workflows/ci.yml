name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smesay
          POSTGRES_PASSWORD: smesay
          POSTGRES_DB: smesay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smesay -d smesay"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mailpit:
        image: axllent/mailpit
        ports:
          - 1025:1025
          - 8025:8025
    env:
      CI: "true"
      DATABASE_URL: postgres://smesay:smesay@localhost:5432/smesay
      # The CI session secret is for the throwaway CI database only; it is no secret.
      BETTER_AUTH_SECRET: ci-only-secret-for-the-throwaway-database
      BETTER_AUTH_URL: http://localhost:3000
      MAIL_SMTP_URL: smtp://localhost:1025
      EMAIL_FROM: SMEsay <sign-in@localhost>
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run scan:copy
      - run: npm run check:status
      - run: npm run db:migrate
      - run: npm run db:migrate
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

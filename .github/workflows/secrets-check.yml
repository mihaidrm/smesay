# Reports whether the sign-in and AI secrets exist in this repository, by name only (stories/E2-2,
# docs/accounts.md steps 6, 7 and 9). Run it from the Actions tab ("Run workflow") or with the
# GitHub API; the values are never printed. GitHub masks a secret's value in logs anyway
# (docs.github.com/actions/security-guides/using-secrets-in-github-actions), and this prints
# only "set" or "missing".
name: Secrets check

on:
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
      MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Report each secret as set or missing
        run: |
          for name in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET MICROSOFT_CLIENT_ID MICROSOFT_CLIENT_SECRET ANTHROPIC_API_KEY; do
            if [ -n "${!name}" ]; then echo "$name: set"; else echo "$name: missing"; fi
          done
